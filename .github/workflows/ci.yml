name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep dependency audits covered without running them on every PR.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependency_audit: ${{ steps.filter.outputs.dependency_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci/paths-filter.yml

  dependency_audit:
    name: Dependency audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: [changes]
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.dependency_audit == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Record an advisory with no fix under auditConfig.ignoreGhsas in
      # pnpm-workspace.yaml.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  quality:
    name: Lint, typecheck & test
    # The scheduled run exists for the dependency audit only.
    if: github.event_name != 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the full history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # pnpm only warns on unmet peers; Renovate bumps can break them.
      - run: pnpm peers check

      - name: Annotate Biome diagnostics
        continue-on-error: true
        run: pnpm lint:biome --reporter=github

      - run: actionlint

      # Pre-commit scans only staged changes, and hooks can be bypassed.
      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact --verbose --log-opts=HEAD .

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm spellcheck
      - run: pnpm test:coverage

  build:
    name: Build
    needs: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - run: pnpm build

  storybook:
    name: Storybook build
    needs: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - run: pnpm storybook:build

  e2e:
    name: Playwright
    needs: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression
    needs: quality
    # Baselines are rendered on arm64; see bin/visual-docker.sh.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Chromium runs in the Playwright Docker image, not on the runner.
      - run: pnpm test:visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
