<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://events.mapbox.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <title>Sonic Thames</title>
    <script>
      // Restores the URL that public/404.html packed into the query string, so
      // /?/about&a=1~and~b=2#x becomes /about?a=1&b=2#x before the router reads it.
      ((l) => {
        if (l.search[1] !== "/") return
        const decoded = l.search
          .slice(1)
          .split("&")
          .map((part) => part.replace(/~and~/g, "&"))
          .join("?")
        window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash)
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
